name: sallah_app
description: "Brikol.ma - Moroccan on-demand emergency, auto assistance and home repair aggregator"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  google_maps_flutter: ^2.7.0
  geoflutterfire_plus: ^0.0.21
  geolocator: ^12.0.0
  intl: ^0.20.2
  http: ^1.6.0
  google_fonts: ^6.2.1
  # pdf: removed
  video_player: ^2.9.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_image_compress: ^2.3.0
  audioplayers: ^6.0.0
  pdf: ^3.12.0
  google_sign_in: ^6.2.1
  flutter_stripe: ^13.0.0
  cloud_functions: ^4.7.6
  # printing: removed



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/lang/ar.json
    - assets/lang/fr.json
    - assets/images/brikol_app_icon_192.png
    - assets/images/brikol_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/brikol_app_icon_192.png"
  web:
    generate: true
    image_path: "assets/images/brikol_app_icon_192.png"
    background_color: "#050f0a"
    theme_color: "#0e8050"
